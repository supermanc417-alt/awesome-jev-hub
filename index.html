<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Awesome Jev Hub · Jev / TypeSafe "System One" 生态枢纽</title>
<style>
  :root{--bg:#0a0a0b;--card:#18181b;--mut:#8A8F98;--mut2:#a1a1aa;--orange:#F97316;--line:#27272a;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:#e4e4e7;font-family:-apple-system,"PingFang SC",system-ui,sans-serif;line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
  .wrap{max-width:760px;width:100%;text-align:center}
  .kicker{color:var(--orange);font-size:13px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:14px}
  h1{font-size:40px;font-weight:800;letter-spacing:-.02em;margin-bottom:14px}
  h1 .accent{color:var(--orange)}
  p.lede{color:var(--mut2);font-size:16px;margin:0 auto 28px;max-width:600px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 auto 32px;max-width:560px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 10px}
  .stat .n{font-size:26px;font-weight:800;color:#fff}
  .stat .l{font-size:12px;color:var(--mut);margin-top:4px}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a.btn{display:inline-block;text-decoration:none;padding:13px 26px;border-radius:12px;font-weight:700;font-size:15px;transition:.15s}
  a.primary{background:var(--orange);color:#0a0a0b}
  a.primary:hover{filter:brightness(1.08)}
  a.ghost{background:transparent;color:var(--mut2);border:1px solid var(--line)}
  a.ghost:hover{border-color:var(--orange);color:#fff}
  .foot{margin-top:30px;color:var(--mut);font-size:12px}
  .foot a{color:var(--mut2);text-decoration:none}
  .foot a:hover{color:var(--orange)}
  @media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:30px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Jev · TypeSafe "System One"</div>
  <h1>Awesome <span class="accent">Jev</span> Hub</h1>
  <p class="lede">Jev 生态枢纽：一份经过 GitHub API 实测核验的精选档案 —— 概念、51 个真实项目、12 个方向、10 个社区清单，附官方仓库截图。</p>
  <div class="stats">
    <div class="stat"><div class="n">51</div><div class="l">应用项目</div></div>
    <div class="stat"><div class="n">12</div><div class="l">方向分类</div></div>
    <div class="stat"><div class="n">80,428</div><div class="l">累计 Star ★</div></div>
    <div class="stat"><div class="n">10</div><div class="l">社区清单</div></div>
    <div class="stat"><div class="n">51</div><div class="l">官方截图</div></div>
    <div class="stat"><div class="n">100%</div><div class="l">已实测核验</div></div>
  </div>
  <div class="btns">
    <a class="btn primary" href="jev-collection.html">查看完整收藏篇 →</a>
    <a class="btn ghost" href="https://github.com/supermanc417-alt/awesome-jev-hub" target="_blank" rel="noopener">GitHub 仓库</a>
  </div>
  <div class="foot">数据于 2026-09-22 经 GitHub API 实测刷新 · 托管于 <a href="https://github.com/supermanc417-alt/awesome-jev-hub" target="_blank" rel="noopener">supermanc417-alt/awesome-jev-hub</a></div>
</div>
</body>
</html>
